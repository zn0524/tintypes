name: tintypes
description: "Detect ai images and text, keep yourself safe on the internet."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:    
    sdk: flutter
  google_fonts: ^6.2.1
  image_picker: ^1.2.1
  flutter_onnxruntime: ^1.8.5
  image: ^4.2.0
  dart_bert_tokenizer: ^1.3.0
  path_provider: ^2.1.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
      - assets/text_model/
      - assets/image_model/
      - assets/images/
